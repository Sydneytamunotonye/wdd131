<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review for products you have used. Rate features, installation date, and share your written review.">
    <meta name="author" content="Sydney Tamunotonye">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
    <title>WDD 131 – Product Review Form – Sydney Tamunotonye</title>
</head>

<body>
    <header>
        <span id="course-title">WDD 131 – Dynamic Web Fundamentals</span>
        <nav>
            <ul>
                <li><a href="https://www.linkedin.com/in/sydneytamunotonye/">LinkedIn</a></li>
                <li><a href="https://byupw.instructure.com/">I-learn</a></li>
                <li><a href="https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng">Scripture</a>
                </li>
                <li><a href="form.html">Product Review</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Product Review</h1>

        <form method="get" action="review.html" class="review-form">
            <div class="form-field">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-field rating-field">
                <legend>Overall Rating</legend>
                <div class="rating-group">
                    <div class="rating-item">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">&#9734;</label>
                    </div>
                    <div class="rating-item">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <label for="rating2">&#9734;</label>
                    </div>
                    <div class="rating-item">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <label for="rating3">&#9734;</label>
                    </div>
                    <div class="rating-item">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <label for="rating4">&#9734;</label>
                    </div>
                    <div class="rating-item">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <label for="rating5">&#9734;</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-field">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-field features-field">
                <legend>Useful Features</legend>
                <div class="features-group">
                    <div class="feature-item">
                        <input type="checkbox" id="durable" name="features" value="durable">
                        <label for="durable">Durable</label>
                    </div>
                    <div class="feature-item">
                        <input type="checkbox" id="easyToUse" name="features" value="easy to use">
                        <label for="easyToUse">Easy to Use</label>
                    </div>
                    <div class="feature-item">
                        <input type="checkbox" id="affordable" name="features" value="affordable">
                        <label for="affordable">Affordable</label>
                    </div>
                    <div class="feature-item">
                        <input type="checkbox" id="goodValue" name="features" value="good value">
                        <label for="goodValue">Good Value</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-field">
                <label for="writtenReview">Written Review <span class="optional">(optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5"
                    placeholder="Share what you liked or disliked about the product..."></textarea>
            </div>

            <div class="form-field">
                <label for="userName">User Name <span class="optional">(optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>

            <div class="form-field submit-field">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Sydney Tamunotonye. Nigeria All rights reserved.</p>
        <p>last modified: <span id="lastmodified"></span></p>
    </footer>
</body>

</html>
